name: submit

# Ingest, dedupe, embed/prefilter, and submit the triage batch. collect.yml
# picks up the result three hours later — see scripts/submit.py.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-digest-pipeline
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run submit stage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run python scripts/submit.py

      - name: Commit db
        run: |
          git config user.name "ai-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/digest.db
          git diff --cached --quiet || git commit -m "submit: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
