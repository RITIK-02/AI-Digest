# Hard cost budget per run, in dollars. Exceeding this fails the run loudly
# rather than silently spending — see CLAUDE.md "Rules".
#
# Expected steady state is well under $5/month across both providers; this
# cap is a circuit breaker for regressions, not a target.

per_run_usd_cap: 0.50

# Dedupe adjudication is capped independent of cost, in call count.
dedupe_adjudication_max_calls: 15

# Retries on fallback provider before giving up on a stage.
max_retries_per_stage: 1
